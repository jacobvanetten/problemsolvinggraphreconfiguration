extract_network: "Extract actors and exchanges from the case text chunk as nodes and edges of the exchange-network schema. Keep source references in evidence. Unsourced additions carry confidence 'hypothesis'."
network_review: "Review the network from your discipline. Propose edits (add_node, add_edge, update_node, update_edge, split via add/remove) and short notes. Every added element must carry evidence confidence 'hypothesis' unless sourced."
lens_note: "Write your opening lens note in at most 600 words: what Dorst's theme mapping and analogue search get right from your discipline, what they miss, how network reasoning could help or why it would not, one hunch for a method, and what you notice in the case A field map as an example."
lens_synthesis: "Merge the opening lens notes into a neutral synthesis. Keep disagreements visible. Hold no content position."
method_draft: "Draft a reframing method in prose (max 500 words) that improves on Dorst's theme mapping and analogue search, from your discipline. Say what the method does that theirs does not, and give your must_produce element."
method_response: "Read your partner's draft. Respond in at most 300 words, then give your own draft in at most 500 words, addressing where you agree and differ."
method_protocol: "Write the joint method protocol in the required schema: at most 1,500 words of prose plus a structured step list. Steps use roles, not persona ids. Total step max_calls must fit the budget, and budget_calls must not exceed the trial cap. Do not include author names."
exec_step: "Run this step of the protocol on the case, using only the written protocol, the case files, the network and your tools. If the step is unclear, state in 'interpretation' what you assumed. Do not guess silently. Label any claim about people, places or crops as a hypothesis unless it comes from a source."
frames: "Produce 1 to 3 frames in the form 'If the problem situation is approached as if it is X, then Y'. Mark your best. For each, state in at most 150 words what it lets the team see, and cite step ids as evidence."
executor_notes: "In at most 300 words, say how it was to run this method: where it flowed, where you got stuck, which steps felt empty."
ethnography: "Observe this trial from its trace only. In at most 400 words record where executors got stuck, where surprises came from, which steps did no work, and how the protocol was interpreted. You do not author, execute or judge."
aar_designers: "Answer the four after-action questions from the designers' side: what was supposed to happen, what happened, why the difference, what should change."
aar_executors: "Answer the four after-action questions from the executors' side, citing step ids."
aar_ethnographer: "Answer the four after-action questions as observer, citing trace lines."
aar: "Write the after-action review with the required sections. Every claim cites a step id, a trace line or an interpretation note. Judge frame quality and method quality separately and say which issues belong to the method, the case or the executors."
revise_stuck: "Add an example frame from Trial 1 to the protocol and make a first revision limited to fixing stuck points. Larger changes wait for the café. Log every change. The step list must stay within budget."
cafe_items: "You are a visitor at a method table. Give exactly three items, each at most 80 words: an addition (a component, representation, rule or technique), a challenge (a weakness, with a reason tied to the protocol or the AAR) and a graft (a component carried from elsewhere). Include your must_produce element in one item and say which. Every visit includes a challenge."
reception: "You host this table. Answer every item with adopt, adapt or decline plus one line of reason. Silence is not allowed."
revision: "Revise the protocol. Name the ledger items behind each change. Only items you adopted or adapted may drive changes. The step list must stay within budget."
harvest: "Write the round harvest in at most 600 words: cross-table patterns, recurring components, converging methods, open disagreements, and the newcomer items with the most uptake."
fixation_note: "Add one note on fixation in the lab itself: where is the lab converging too early?"
merge_check: "Do any methods converge? Propose merges as pairs of method ids, or none."
merge_agree: "Do you, as authors, agree to merge these two methods? Answer agree true or false with a reason."
merge_methods: "Write the merged protocol in the required schema."
digest: "Write a neutral trial digest for this method in at most 600 words: steps that did and did no work in each trial, stuck points, how revisions changed Trial 2, cost in calls, executor notes in brief, and the ethnographer's main observation. Report; do not argue."
digest_check: "Check this digest against the after-action reviews. Say ok, or list mismatches."
judge: "Judge this block."
summarise: "Group the mentions into at most 3 strength themes and 3 weakness themes per criterion, each at most 80 characters, citing mention ids."
difference_column: "Fill one column of the difference matrix for this method, neutrally, with AAR references for failures."
statement: "Discuss in at most 300 words which differences between the top methods matter, which components are compatible or exclusive, and why. Name one weakness of a top method."
difference_map: "Tag pairs of components across the selected methods as complementary, compatible, in_tension or exclusive, with reasons and sources."
composite: "Compose the modular composite method in the protocol template. Modules have clear interfaces (inputs, outputs) and full lineage. Name failed modules with AAR evidence. Resolve or name as an open choice every exclusive pair."
objection: "Raise one objection to the composite in at most 150 words."
integrator_answer: "Answer each objection. You may revise the composite once. Say which objections stay unresolved."
leakage_probe: "Identify the source of this case if you can. Say 'unknown' if you cannot."
reflection: "Write your final reflection in at most 300 words."
final_reflection: "Synthesise the final reflection with these sections: generalises, depends_on_case_A, lab_process, toolkit, next_run."
revise_composite: "Revise the composite once in light of case B and return it in the composite schema."
implementation_notes: "Write what the pipeline must change to run the method, as concrete notes."
field_questions: "Turn every hypothesis about human actors into a question for the Nigeria field test."
