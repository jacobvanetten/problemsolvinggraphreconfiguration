[project]
name = "signedgraph"
version = "0.1.0"
description = "Signed directed graphs with source passages: path signs, cycle polarity and edge-flip analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.7",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pyvis>=0.3.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
